[project]
name = "youtube"
version = "0.1.0"
description = "Read-only stdio MCP server for the YouTube Data API v3"
readme = "README.md"
authors = [
    { name = "Dwight Fowler", email = "83466469+dwightfowler-cd@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.2,<2",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
youtube = "youtube.server:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "oauth: needs a real OAuth token from `uv run youtube auth`; fails without one (never skipped)",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The codebase uses ~100-column lines; line length is style, not a bug.
ignore = ["E501"]
